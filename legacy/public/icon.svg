<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle tech frame -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Central FieldOps Tech Icon: Isometric Storage Box & Network Nodes -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Top Cube Face -->
    <polygon points="0,-120 110,-55 0,10 -110,-55" fill="url(#accentGrad)" />
    <!-- Left Cube Face -->
    <polygon points="-110,-55 0,10 0,135 -110,70" fill="#0f766e" />
    <!-- Right Cube Face -->
    <polygon points="0,10 110,-55 110,70 0,135" fill="#047857" />

    <!-- Server Circuit Accents / Data Bars on Cube Faces -->
    <line x1="-80" y1="20" x2="-25" y2="55" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
    <line x1="-80" y1="50" x2="-50" y2="70" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
    
    <line x1="25" y1="55" x2="80" y2="20" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" />
    <line x1="50" y1="70" x2="80" y2="50" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" />

    <!-- Center Pulse Node -->
    <circle cx="0" cy="-55" r="16" fill="#ffffff" />
    <circle cx="0" cy="-55" r="26" fill="none" stroke="#a7f3d0" stroke-width="4" />
  </g>

  <!-- Signal status badge / IT Connectivity Nodes -->
  <circle cx="390" cy="120" r="18" fill="#10b981" />
  <circle cx="390" cy="120" r="28" fill="none" stroke="#10b981" stroke-width="4" opacity="0.5" />
</svg>
