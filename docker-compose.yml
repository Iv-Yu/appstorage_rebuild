version: '3.8'

services:
  mariadb:
    image: mariadb:11.4
    container_name: fieldops_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?ERR: DB_ROOT_PASSWORD wajib diisi di file .env!}
      MYSQL_DATABASE: ${DB_NAME:-fieldops_inventory}
      MYSQL_USER: ${DB_USER:-fieldops_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?ERR: DB_PASSWORD wajib diisi di file .env!}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backend/src/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      # Port internal MariaDB hanya diekspos ke localhost server kantor (bukan internet)
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fieldops_internal_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fieldops_app
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-fieldops_inventory}
      DB_USER: ${DB_USER:-fieldops_user}
      DB_PASSWORD: ${DB_PASSWORD:?ERR: DB_PASSWORD wajib diisi di file .env!}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?ERR: APP_SECRET_KEY wajib diisi di file .env!}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://api.fonnte.com/send}
      WHATSAPP_TARGET_PHONES: ${WHATSAPP_TARGET_PHONES:-}
    volumes:
      - ./backups:/app/backups
    ports:
      - "3000:3000"
    networks:
      - fieldops_internal_net

  # Cloudflare Tunnel: Akses Jarak Jauh Atasan Tanpa Buka Port Firewall / CGNAT
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fieldops_cloudflared_tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - backend
    networks:
      - fieldops_internal_net

volumes:
  mariadb_data:
    driver: local

networks:
  fieldops_internal_net:
    driver: bridge
